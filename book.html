<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a Visit | Greenfield Community Clinic</title><link rel="stylesheet" href="css/styles.css"></head>
<body><a class="skip-link" href="#content">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="Greenfield Community Clinic logo"><span>GREENFIELD<br>CLINIC</span></a><button class="nav-toggle" aria-label="Open navigation" aria-expanded="false">Menu</button><nav class="primary-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="services.html">Services</a><a class="active" href="book.html">Book visit</a><a href="contact.html">Contact</a></nav></div></header>
<main id="content" class="container page booking"><p class="eyebrow">REQUEST A VISIT</p><h1>Let’s find a time.</h1><p>Send us your preferred time and our front desk will confirm within one business day.</p><form id="booking-form" novalidate><div class="form-grid"><div><label for="patient-name">Your name</label><input id="patient-name" name="name" type="text" required></div><div><label>Email address</label><input id="patient-email" name="email" type="email" placeholder="you@example.com" required></div><div><label for="visit-date">Preferred date</label><input id="visit-date" name="date" type="date" required></div><div><input name="phone" type="tel" placeholder="Mobile number"></div><div><label for="visit-type">Visit type</label><select id="visit-kind" name="visit_type"><option>Choose a visit</option><option>Walk-in care</option><option>Annual wellness</option><option>Immunization</option></select></div><div><input id="patient-name" name="insurance" type="text" placeholder="Insurance provider"></div></div><label for="visit-note">Anything we should know?</label><textarea id="visit-note" name="note" rows="4" placeholder="A short note is helpful, but please don't include urgent symptoms."></textarea><button class="button" type="submit">Send request</button><p class="form-message" aria-live="polite"></p></form><button class="round-button" aria-label="Call clinic"><img src="assets/phone.svg" alt=""></button></main><footer class="site-footer"><div class="container footer-bottom">© 2026 Greenfield Community Clinic <a href="contact.html">Contact us</a></div></footer><script src="js/app.js"></script></body></html>
